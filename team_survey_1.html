<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анонимный опрос команды — HR HUB</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #E8450A;
  --orange-light: #FFF3EE;
  --green: #27AE60;
  --green-light: #F0FFF6;
  --red: #E02020;
  --bg: #f7f4ef;
  --card: #ffffff;
  --border: #e8e2d9;
  --text: #1a1a1a;
  --muted: #7a7a7a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); font-family: 'Onest', sans-serif; color: var(--text); min-height: 100vh; padding: 40px 20px 80px; }
body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--orange), #FF6B35); }
.container { max-width: 600px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 40px; }
.brand { font-family: 'Unbounded', sans-serif; font-size: 11px; font-weight: 700; color: var(--orange); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
.header h1 { font-family: 'Unbounded', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.3; margin-bottom: 12px; }
.header p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
.company-name { font-size: 13px; font-weight: 700; color: var(--orange); margin-bottom: 8px; }
.anon-badge { display: inline-flex; align-items: center; gap: 7px; background: var(--green-light); border: 1px solid #A8EDCA; color: var(--green); font-size: 12px; font-weight: 600; padding: 7px 16px; border-radius: 20px; }
.progress-wrap { margin-bottom: 32px; }
.progress-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.progress-bar { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--orange), #FF6B35); border-radius: 4px; transition: width 0.4s ease; width: 0%; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 28px; margin-bottom: 20px; box-shadow: 0 2px 20px rgba(0,0,0,0.04); }
.q-number { font-size: 11px; font-weight: 700; color: var(--orange); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
.q-text { font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 600; line-height: 1.4; margin-bottom: 8px; }
.q-hint { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
.scale { display: flex; gap: 6px; margin-bottom: 10px; }
.scale-btn { flex: 1; aspect-ratio: 1; border: 2px solid var(--border); border-radius: 10px; background: none; cursor: pointer; font-family: 'Onest', sans-serif; font-size: 15px; font-weight: 600; color: var(--muted); transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
.scale-btn:hover { border-color: var(--orange); color: var(--orange); }
.scale-btn.selected { border-color: var(--orange); background: var(--orange); color: white; box-shadow: 0 4px 12px rgba(232,69,10,0.25); }
.scale-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.options { display: flex; flex-direction: column; gap: 10px; }
.option-btn { padding: 13px 16px; border: 2px solid var(--border); border-radius: 12px; background: none; cursor: pointer; font-family: 'Onest', sans-serif; font-size: 13px; font-weight: 500; color: var(--text); text-align: left; transition: all 0.15s; line-height: 1.4; }
.option-btn:hover { border-color: var(--orange); background: var(--orange-light); }
.option-btn.selected { border-color: var(--orange); background: var(--orange-light); color: var(--orange); font-weight: 600; }
.q-textarea { width: 100%; min-height: 90px; padding: 12px 14px; border: 2px solid var(--border); border-radius: 12px; font-family: 'Onest', sans-serif; font-size: 13px; color: var(--text); background: var(--bg); resize: vertical; outline: none; transition: border-color 0.2s; line-height: 1.6; }
.q-textarea:focus { border-color: var(--orange); }
.nav { display: flex; gap: 12px; margin-top: 8px; }
.btn-back { padding: 13px 22px; border: 2px solid var(--border); border-radius: 12px; background: none; font-family: 'Onest', sans-serif; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all 0.15s; }
.btn-back:hover { border-color: var(--orange); color: var(--orange); }
.btn-next { flex: 1; padding: 13px 22px; border: none; border-radius: 12px; background: var(--orange); font-family: 'Unbounded', sans-serif; font-size: 12px; font-weight: 700; color: white; cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px; }
.btn-next:hover { background: #c73d08; transform: translateY(-1px); }
.btn-next:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }
.results { display: none; }
.result-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 28px; margin-bottom: 16px; box-shadow: 0 2px 20px rgba(0,0,0,0.04); }
.result-title { font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
.metric-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
.metric-row:last-child { border-bottom: none; }
.metric-name { font-size: 13px; font-weight: 500; flex: 1; }
.metric-bar-wrap { flex: 1; margin: 0 12px; }
.metric-bar { height: 5px; background: var(--border); border-radius: 5px; overflow: hidden; }
.metric-bar-fill { height: 100%; border-radius: 5px; transition: width 0.8s ease; }
.metric-score { font-weight: 700; font-size: 14px; min-width: 40px; text-align: right; }
.insight-item { padding: 12px 14px; background: var(--bg); border-radius: 10px; margin-bottom: 8px; font-size: 13px; line-height: 1.6; border-left: 3px solid var(--orange); }
.priority-box { background: var(--orange); color: white; padding: 20px 24px; border-radius: 14px; margin-top: 16px; }
.priority-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.7); margin-bottom: 8px; }
.priority-text { font-size: 14px; line-height: 1.6; font-weight: 500; }
.loading { text-align: center; padding: 32px; color: var(--muted); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--orange); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.thank-you { text-align: center; margin-bottom: 24px; }
.thank-you h2 { font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.thank-you p { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="brand">HR HUB</div>
    <h1>Как вам работается в команде?</h1>
    <div class="company-name" id="companyDisplay"></div>
    <p>Честные ответы помогут руководителю принять правильные решения. Займёт 3–5 минут.</p>
    <div class="anon-badge">🔒 Полностью анонимно — имена не собираются</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-top">
      <span id="progressLabel">Вопрос 1 из 10</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div id="surveyScreen">
    <div class="card" id="questionCard"></div>
    <div class="nav">
      <button class="btn-back" id="btnBack" onclick="prevQ()" style="display:none">← Назад</button>
      <button class="btn-next" id="btnNext" onclick="nextQ()">Далее →</button>
    </div>
  </div>

  <div class="results" id="resultsScreen">
    <div class="thank-you">
      <h2>Спасибо за честность 🙏</h2>
      <p id="resultsSubtitle">Анализирую ответы...</p>
    </div>
    <div id="resultsContent">
      <div class="result-card">
        <div class="loading"><div class="spinner"></div><p>Готовлю анализ для руководителя...</p></div>
      </div>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  { id: "energy", type: "scale", text: "Как вы оцениваете свою энергию и желание работать последние 2 недели?", hint: "1 — полностью выгорел, 10 — на подъёме", min: "Полностью выгорел", max: "На подъёме" },
  { id: "clarity", type: "scale", text: "Насколько вам понятны ваши задачи и зоны ответственности?", hint: "1 — полная неразбериха, 10 — всё чётко", min: "Полная неразбериха", max: "Всё чётко" },
  { id: "overload", type: "options", text: "Как вы оцениваете свою загрузку прямо сейчас?", hint: "", options: ["😴 Недогружен — есть время и силы", "✅ В норме — справляюсь комфортно", "⚡ Немного перегружен, но терпимо", "🔥 Серьёзный перегруз, не успеваю", "💥 На пределе, срочно нужна помощь"] },
  { id: "communication", type: "scale", text: "Насколько комфортна коммуникация внутри команды?", hint: "1 — постоянные конфликты, 10 — открыто и уважительно", min: "Конфликты", max: "Открыто и уважительно" },
  { id: "recognition", type: "options", text: "Чувствуете ли вы, что ваш вклад замечают и ценят?", hint: "", options: ["✅ Да, регулярно", "🤷 Иногда, но хотелось бы чаще", "❌ Практически никогда", "😶 Мне это не важно"] },
  { id: "obstacles", type: "options", text: "Что больше всего мешает вам работать эффективно?", hint: "Выберите главное", options: ["😵 Непонятные задачи и постоянные изменения", "🗣 Конфликты или напряжение в команде", "⏰ Слишком много задач, не хватает времени", "🔧 Не хватает инструментов или ресурсов", "😶 Нет мотивации, потерял смысл", "✅ Особых препятствий нет"] },
  { id: "manager", type: "scale", text: "Насколько вы чувствуете поддержку руководителя?", hint: "1 — не чувствую совсем, 10 — полная поддержка", min: "Не чувствую", max: "Полная поддержка" },
  { id: "leave_risk", type: "options", text: "Думали ли вы о смене работы за последний месяц?", hint: "", options: ["🙅 Нет, всё устраивает", "🤔 Иногда мелькают мысли", "😬 Думаю об этом довольно часто", "🚪 Активно ищу другие варианты"] },
  { id: "team_result", type: "scale", text: "Как вы оцениваете способность команды достигать результатов вместе?", hint: "1 — каждый сам по себе, 10 — работаем как единое целое", min: "Каждый сам по себе", max: "Единое целое" },
  { id: "open_comment", type: "text", text: "Что, по-вашему, нужно изменить в первую очередь?", hint: "Необязательно. Напишите что считаете важным — это анонимно.", placeholder: "Можете написать свободно..." }
];

let current = 0;
let answers = {};
const company = new URLSearchParams(window.location.search).get('company') || '';

// Show company name
if (company) {
  document.getElementById('companyDisplay').textContent = company;
}

function renderQuestion(idx) {
  const q = QUESTIONS[idx];
  const total = QUESTIONS.length;
  const pct = Math.round((idx / total) * 100);

  document.getElementById('progressLabel').textContent = `Вопрос ${idx+1} из ${total}`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('btnBack').style.display = idx > 0 ? 'block' : 'none';
  document.getElementById('btnNext').textContent = idx === total-1 ? 'Готово ✓' : 'Далее →';

  let html = `<div class="q-number">Вопрос ${idx+1}</div><div class="q-text">${q.text}</div>`;
  if (q.hint) html += `<div class="q-hint">${q.hint}</div>`;

  if (q.type === 'scale') {
    html += '<div class="scale">';
    for (let i = 1; i <= 10; i++) {
      const sel = answers[q.id] == i ? 'selected' : '';
      html += `<button class="scale-btn ${sel}" onclick="selectScale('${q.id}',${i},this)">${i}</button>`;
    }
    html += `</div><div class="scale-labels"><span>${q.min}</span><span>${q.max}</span></div>`;
  } else if (q.type === 'options') {
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      const sel = answers[q.id] === i ? 'selected' : '';
      html += `<button class="option-btn ${sel}" onclick="selectOption('${q.id}',${i},this)">${opt}</button>`;
    });
    html += '</div>';
  } else if (q.type === 'text') {
    html += `<textarea class="q-textarea" id="textAnswer" placeholder="${q.placeholder||''}" oninput="answers['${q.id}']=this.value">${answers[q.id]||''}</textarea>`;
  }

  const card = document.getElementById('questionCard');
  card.style.opacity = '0';
  card.innerHTML = html;
  setTimeout(() => { card.style.transition = 'opacity 0.3s'; card.style.opacity = '1'; }, 20);
  updateBtn();
}

function selectScale(id, val, el) {
  answers[id] = val;
  el.closest('.scale').querySelectorAll('.scale-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  updateBtn();
}

function selectOption(id, idx, el) {
  answers[id] = idx;
  el.closest('.options').querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  updateBtn();
}

function updateBtn() {
  const q = QUESTIONS[current];
  const btn = document.getElementById('btnNext');
  btn.disabled = q.type !== 'text' && answers[q.id] === undefined;
}

function nextQ() {
  if (current < QUESTIONS.length - 1) { current++; renderQuestion(current); }
  else { showResults(); }
}

function prevQ() {
  if (current > 0) { current--; renderQuestion(current); }
}

function buildSummary() {
  const qs = QUESTIONS;
  const a = answers;
  return `Компания: ${company || 'не указана'}
Энергия (1-10): ${a.energy ?? '—'}
Ясность задач (1-10): ${a.clarity ?? '—'}
Загрузка: ${a.overload !== undefined ? qs[2].options[a.overload] : '—'}
Коммуникация (1-10): ${a.communication ?? '—'}
Признание: ${a.recognition !== undefined ? qs[4].options[a.recognition] : '—'}
Препятствие: ${a.obstacles !== undefined ? qs[5].options[a.obstacles] : '—'}
Поддержка руководителя (1-10): ${a.manager ?? '—'}
Риск ухода: ${a.leave_risk !== undefined ? qs[7].options[a.leave_risk] : '—'}
Эффективность команды (1-10): ${a.team_result ?? '—'}
Комментарий: ${a.open_comment || 'не оставил'}`;
}

function showResults() {
  document.getElementById('surveyScreen').style.display = 'none';
  document.getElementById('resultsScreen').style.display = 'block';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressPct').textContent = '100%';
  runAnalysis();
}

async function runAnalysis() {
  try {
    const resp = await fetch("https://hrhub-survey-production.up.railway.app/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answers: answers, company: company })
    });
    const result = await resp.json();
    renderAnalysis(result);
  } catch(e) {
    renderFallback();
  }
}

function renderAnalysis(result) {
  document.getElementById('resultsSubtitle').textContent = 'Анализ готов. Результаты отправлены руководителю.';
  const score = result.health_score || 50;
  const color = score >= 67 ? '#27AE60' : score >= 34 ? '#F5A623' : '#E02020';

  let html = `<div class="result-card">
    <div class="result-title" style="color:${color}">📊 Индекс здоровья: ${score}/100</div>`;

  if (result.metrics) {
    result.metrics.forEach(m => {
      const s = m.score;
      const isRisk = m.name.includes('Риск');
      const c = (isRisk ? s > 60 : s < 40) ? '#E02020' : (isRisk ? s > 30 : s < 65) ? '#F5A623' : '#27AE60';
      html += `<div class="metric-row">
        <div class="metric-name">${m.name}</div>
        <div class="metric-bar-wrap"><div class="metric-bar"><div class="metric-bar-fill" style="width:${s}%;background:${c}"></div></div></div>
        <div class="metric-score" style="color:${c}">${s}</div>
      </div>`;
    });
  }
  html += '</div>';

  if (result.insights || result.summary) {
    html += '<div class="result-card"><div class="result-title">💡 Выводы</div>';
    const insights = result.insights || [result.summary];
    insights.forEach(i => { html += `<div class="insight-item">${i}</div>`; });
    html += '</div>';
  }

  if (result.priority_action) {
    html += `<div class="result-card"><div class="priority-box"><div class="priority-label">⚡ Приоритетное действие</div><div class="priority-text">${result.priority_action}</div></div></div>`;
  }

  document.getElementById('resultsContent').innerHTML = html;
}

function renderFallback() {
  document.getElementById('resultsSubtitle').textContent = 'Ответы получены и переданы руководителю.';
  document.getElementById('resultsContent').innerHTML = `<div class="result-card"><div class="insight-item">✅ Ваши ответы успешно записаны. Руководитель получит результаты в ближайшее время.</div></div>`;
}

renderQuestion(0);
</script>
</body>
</html>
